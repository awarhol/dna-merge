<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://dna-merge.vercel.app/" />
    <title>DNA Merge has moved</title>
    <script>
      ;(function () {
        var target = 'https://dna-merge.vercel.app'
        // Preserve deep links: /dna-merge/<route>?<query>#<hash> -> /<route>?<query>#<hash>
        var path = window.location.pathname.replace(/^\/dna-merge\/?/, '/')
        var query = window.location.search
        var hash = window.location.hash
        window.location.replace(target + path + query + hash)
      })()
    </script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        color: #1f2937;
      }
      a {
        color: #6366f1;
      }
    </style>
  </head>
  <body>
    <p>
      This tool has moved to
      <a href="https://dna-merge.vercel.app/">dna-merge.vercel.app</a>...
    </p>
  </body>
</html>
